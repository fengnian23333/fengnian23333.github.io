<button id="reading-mode-switch" class="reading-mode-switch" type="button" aria-live="polite" aria-label="切换到夜间模式" title="切换到夜间模式">
  <span class="reading-mode-switch__icon" aria-hidden="true">☀</span>
  <span class="reading-mode-switch__text">日间</span>
</button>

<script>
  (function() {
    var STORAGE_KEY = 'reading-mode';
    var root = document.documentElement;
    var switcher = document.getElementById('reading-mode-switch');
    if (!switcher) return;

    var icon = switcher.querySelector('.reading-mode-switch__icon');
    var text = switcher.querySelector('.reading-mode-switch__text');

    function getInitialMode() {
      try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved === 'light' || saved === 'dark') return saved;
      } catch (e) {}
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function updateMode(mode) {
      var isDark = mode === 'dark';
      root.setAttribute('data-reading-mode', mode);
      switcher.setAttribute('data-mode', mode);
      if (icon) icon.textContent = isDark ? '☾' : '☀';
      if (text) text.textContent = isDark ? '夜间' : '日间';
      var nextLabel = isDark ? '切换到日间模式' : '切换到夜间模式';
      switcher.setAttribute('aria-label', nextLabel);
      switcher.title = nextLabel;
    }

    function toggleMode() {
      var current = root.getAttribute('data-reading-mode') === 'dark' ? 'dark' : 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      updateMode(next);
      try {
        localStorage.setItem(STORAGE_KEY, next);
      } catch (e) {}
    }

    updateMode(getInitialMode());
    switcher.addEventListener('click', toggleMode);
    switcher.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleMode();
      }
    });
  })();
</script>
